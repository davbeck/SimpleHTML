name: swiftformat

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.swift"
      - ".github/workflows/swiftformat.yml"
      - ".swiftformat"
      - "Package.resolved"
      - "bin/format"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - run: bin/format

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: format
          file_pattern: '*.swift'
