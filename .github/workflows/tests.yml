name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test macOS
    # The checked-in macOS snapshots were recorded on macOS 27.0.1.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: swift test

      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-snapshots-macos
          path: |
            ${{ runner.temp }}/BlockTextViewSnapshotTests
            ${{ runner.temp }}/DocumentationSnapshotTests

  ios:
    name: Test iOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        # Snapshot cases use SwiftUI view modifiers introduced in iOS 16.
        run: |
          set -o pipefail
          xcodebuild -scheme SimpleHTML \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -resultBundlePath .build/TestResults-iOS.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            test | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: .build/TestResults-iOS.xcresult

